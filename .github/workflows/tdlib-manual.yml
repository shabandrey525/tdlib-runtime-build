{
  "name": "PUBLIC TDLib-only GNU x64 reviewed manual build",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "mode": {
          "type": "choice",
          "required": true,
          "default": "diagnostic",
          "options": [
            "diagnostic",
            "build"
          ],
          "description": "Diagnostic: offline preflight only; build: reviewed pinned TDLib compilation"
        },
        "free_quota_checked": {
          "type": "boolean",
          "required": true,
          "default": false,
          "description": "Fresh review confirms free standard public Windows runner and storage allowance"
        },
        "no_paid_overage": {
          "type": "boolean",
          "required": true,
          "default": false,
          "description": "Actions budget remains $0 with usage blocked; no paid overage"
        },
        "licenses_reviewed": {
          "type": "boolean",
          "required": true,
          "default": false,
          "description": "Reviewed GCC Runtime Exception, MinGW and pinned OpenSSL/zlib notices; no MSVC redistribution"
        },
        "quota_checked_utc": {
          "type": "string",
          "required": true,
          "description": "ISO8601 UTC billing receipt, at most 15 minutes old"
        },
        "free_storage_mb": {
          "type": "string",
          "required": true,
          "description": "Fresh remaining artifact allowance in MB; minimum reserve 125"
        }
      }
    }
  },
  "permissions": {},
  "concurrency": {
    "group": "tdlib-manual-public-only-build",
    "cancel-in-progress": false
  },
  "jobs": {
    "build": {
      "if": "${{ github.repository == 'shabandrey525/tdlib-runtime-build' && github.event.repository.private == false && github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && (inputs.mode == 'diagnostic' || inputs.mode == 'build') && inputs.free_quota_checked && inputs.no_paid_overage && inputs.licenses_reviewed }}",
      "runs-on": "windows-2022",
      "timeout-minutes": "${{ inputs.mode == 'diagnostic' && 10 || 120 }}",
      "defaults": {
        "run": {
          "shell": "pwsh"
        }
      },
      "env": {
        "TD_BUILD_APPROVED": "reviewed-manual-only"
      },
      "steps": [
        {
          "name": "Manual billing/license guard and embedded reviewed helpers",
          "env": {
            "INPUT_QUOTA_OK": "${{ inputs.free_quota_checked }}",
            "INPUT_NO_PAID": "${{ inputs.no_paid_overage }}",
            "INPUT_LICENSES": "${{ inputs.licenses_reviewed }}",
            "INPUT_CHECKED_UTC": "${{ inputs.quota_checked_utc }}",
            "INPUT_STORAGE_MB": "${{ inputs.free_storage_mb }}",
            "TD_HELPERS": "${{ runner.temp }}/tdlib-reviewed-helpers-${{ github.run_id }}"
          },
