lue':'PASS','dll_sha256':hashlib.sha256((root/'tdjson.dll').read_bytes()).hexdigest(),'client_created':False,'login':False,\n            'network_method_invoked':False,'note':'not an OS network sandbox'}\n\nif __name__=='__main__':\n    try: print(json.dumps(probe(sys.argv[1])))\n    except Exception: sys.exit('offline_ABI_probe_failed')\n\n'@\n$helper=$helper.Replace(\"`r`n\",\"`n\").Replace(\"`r\",\"`n\")\n[IO.File]::WriteAllText((Join-Path $env:TD_HELPERS 'offline_probe.py'),$helper,[Text.UTF8Encoding]::new($false))\n$helper=@'\nimport pathlib,zipfile,stat,sys\ndef extract(archive,destination):\n    root=pathlib.Path(destination).resolve()\n    if root.exists():raise ValueError('new_destination_required')\n    with zipfile.ZipFile(archive) as z:\n        items=z.infolist();seen=set()\n        if len(items)>20000 or sum(x.file_size for x in items)>500_000_000:raise ValueError('archive_cap')\n        for x in items:\n            n=x.filename;p=pathlib.PurePosixPath(n)\n            if n.startswith(('/','\\\\')) or '\\\\' in n or ':' in n or '..' in p.parts or n.lower() in seen or stat.S_ISLNK(x.external_attr>>16):\n                raise ValueError('unsafe_archive_path')\n            if not (root/n).resolve().is_relative_to(root):raise ValueError('escape')\n            seen.add(n.lower())\n        for x in items:\n            t=root/x.filename\n            if x.is_dir():t.mkdir(parents=True,exist_ok=True)\n            else:t.parent.mkdir(parents=True,exist_ok=True);t.write_bytes(z.read(x))\nif __name__=='__main__':extract(*sys.argv[1:])\n\n'@\n$helper=$helper.Replace(\"`r`n\",\"`n\").Replace(\"`r\",\"`n\")\n[IO.File]::WriteAllText((Join-Path $env:TD_HELPERS 'safe_extract.py'),$helper,[Text.UTF8Encoding]::new($false))\n$helper=@'\n\"\"\"Materialize a hash/signature-verified toolchain only inside future runner.temp. No package hooks.\"\"\"\nimport pathlib,tarfile,subprocess,hashlib,json,sys,shutil,re,os,tempfile,threading\n\ndef unpack_stream(stream,dest,prefix=''):\n    dest=pathlib.Path(dest).resolve();seen=set();total=0;count=0;hardlinks=[]\n    with tarfile.open(fileobj=stream,mode='r|') as archive:\n        for m in archive:\n            count+=1;total+=m.size\n            if count>100000 or total>1_500_000_000:raise ValueError('archive_cap')\n            name=m.name.removeprefix('./')\n            if prefix:\n                if name.rstrip('/')==prefix.rstrip('/'):continue\n                if not name.startswith(prefix):raise ValueError('archive_prefix')\n                name=name[len(prefix):]\n            p=pathlib.PurePosixPath(name)\n            if not name or name.startswith(('/','\\\\')) or '\\\\' in name or ':' in name or '..' in p.parts:\n                raise ValueError('archive_path')\n            if name.lower() in seen:raise ValueError('archive_collision')\n            seen.add(name.lower());target=dest/name\n            if not target.resolve().is_relative_to(dest):raise ValueError('archive_escape')\n            if m.islnk():\n                link=m.linkname.removeprefix('./');lp=pathlib.PurePosixPath(link)\n                if prefix:\n                    if not link.startswith(prefix):raise ValueError('hardlink_prefix')\n                    link=link[len(prefix):];lp=pathlib.PurePosixPath(link)\n                if not link or link.startswith(('/','\\\\')) or '\\\\' in link or ':' in link or '..' in lp.parts:\n                    raise ValueError('unsafe_hardlink')\n                source=dest/link\n                if not source.resolve().is_relative_to(dest):raise ValueError('hardlink_escape')\n                hardlinks.append((target,source));continue\n            if not(m.isfile() or m.isdir()):raise ValueError('archive_link_or_special')\n            if name.startswith('.') and not prefix:continue # package metadata/hooks never executed or installed\n            if m.isdir():target.mkdir(parents=True,exist_ok=True)\n            else:\n                target.parent.mkdir(parents=True,exist_ok=True)\n                with archive.extractfile(m) as src,target.open('wb') as out:shutil.copyfileobj(src,out,1024*1024)\n    while hardlinks:\n        pending=[];progress=False\n        for target,source in hardlinks:\n            if source.is_file() and not(source.is_symlink() or source.is_junction()):\n                total+=source.stat().st_size\n                if total>1_500_000_000:raise ValueError('hardlink_copy_cap')\n                target.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(source,target);progress=True\n            else:pending.append((target,source))\n        if not progress:raise ValueError('hardlink_target_missing_or_cycle')\n        hardlinks=pending\n\ndef checked(p,expected):\n    if hashlib.sha256(p.read_bytes()).hexdigest()!=expected:raise ValueError('archive_hash')\n\nclass DecoderFailure(ValueError):\n    def __init__(self,report):\n        super().__init__('zstd_decode');self.report=report\n\ndef validate_tar_envelope(stream,total_bytes,max_padding=64*1024*1024):\n    if total_bytes%512:raise ValueError('tar_block_alignment')\n    stream.seek(0);count=0;payload=0\n    with tarfile.open(fileobj=stream,mode='r:') as archive:\n        for member in archive:\n            count+=1;payload+=member.size\n            if member.size<0 or count>100000 or payload>1_500_000_000:raise ValueError('archive_cap')\n        end=archive.offset\n    trailing=total_bytes-end\n    if trailing<1024:raise ValueError('tar_missing_eof_blocks')\n    if trailing>max_padding:raise ValueError('tar_padding_cap')\n    stream.seek(end)\n    while chunk:=stream.read(65536):\n        if any(chunk):raise ValueError('tar_nonzero_trailing_data')\n    return {'members':count,'declared_payload_bytes':payload,'tar_end':end,'zero_padding_bytes':trailing}\n\ndef decode_unpack(zstd,package,dest,stage,*,max_decoded=1_700_000_000,timeout=120,\n                  process_factory=subprocess.Popen):\n    # Drain decoder to a bounded temporary file BEFORE giving tar its own EOF.\n    # Tar cannot close a live decoder pipe; zstd exit/checksum and all padding\n    # checks precede extraction. One temporary file is removed per package.\n    from diagnostics import sanitize_text\n    package,stage=map(pathlib.Path,(package,stage))\n    name=package.name if re.fullmatch(r'[A-Za-z0-9+_.-]{1,180}',package.name) else '[invalid-package-name]'\n    report={'package':name,'archive_sha256':public_digest(package),'decoder_exit':None,\n      'decoded_bytes':0,'timed_out':False,'stderr_tail':[],'failure':None}\n    with tempfile.TemporaryFile(dir=stage) as spool,tempfile.TemporaryFile(dir=stage) as errors:\n        process=None;timer=None;expired=threading.Event()\n        def terminate_owned_decoder():\n            expired.set()\n            if process is not None and process.poll() is None:\n                try:process.kill()\n                except OSError:pass\n        try:\n            process=process_factory([str(zstd),'-dc',str(package)],stdout=subprocess.PIPE,stderr=errors)\n            timer=threading.Timer(timeout,terminate_owned_decoder);timer.daemon=True;timer.start()\n            while chunk:=process.stdout.read(1024*1024):\n                report['decoded_bytes']+=len(chunk)\n                if report['decoded_bytes']>max_decoded:raise ValueError('decoded_size_cap')\n                if os.fstat(errors.fileno()).st_size>65536:raise ValueError('decoder_stderr_cap')\n                spool.write(chunk)\n            process.stdout.close();report['decoder_exit']=process.wait(timeout=5)\n            if expired.is_set():raise ValueError('decoder_timeout')\n            if report['decoder_exit']!=0:raise ValueError('decoder_nonzero_exit')\n            if os.fstat(errors.fileno()).st_size>65536:raise ValueError('decoder_stderr_cap')\n            spool.flush();report['tar']=validate_tar_envelope(spool,report['decoded_bytes'])\n            spool.seek(0);unpack_stream(spool,dest)\n            report['status']='PASS';return report\n        except Exception as e:\n            report['failure']=str(e) if isinstance(e,ValueError) else type(e).__name__\n            if process is not None:\n                if process.poll() is None:\n                    try:process.kill()\n                    except OSError:pass\n                if process.stdout is not None:process.stdout.close()\n                try:report['decoder_exit']=process.wait(timeout=5)\n                except subprocess.TimeoutExpired:report['failure']='decoder_reap_timeout'\n            report['timed_out']=expired.is_set()\n            errors.seek(0,2);size=errors.tell();errors.seek(max(0,size-8192))\n            report['stderr_tail']=sanitize_text(errors.read(8192).decode('utf-8',errors='replace'),stage)[-4:]\n            raise DecoderFailure(report) from None\n        finally:\n            if timer is not None:timer.cancel();timer.join()\n\ndef print_decoder_failure(report):\n    for line in report['stderr_tail'][-4:]:print('ZSTD stderr: '+line[:200])\n    print('ZSTD archive_sha256='+str(report['archive_sha256']))\n    print('ZSTD bytes='+str(report['decoded_bytes'])+' timed_out='+str(report['timed_out']))\n    print('ZSTD package='+report['package'])\n    print('ZSTD exit='+str(report['decoder_exit'])+' failure='+str(report['failure']))\n\ndef verify_dependencies(edges,vercmp):\n    for edge in edges:\n        m=re.fullmatch(r'([^<>=]+)([<>=]+)?(.*)',edge['requirement']);_,op,required=m.groups()\n        if not op:continue\n        actual=edge['version'] if '-' in required else edge['version'].rsplit('-',1)[0]\n        result=subprocess.run([str(vercmp),actual,required],capture_output=True,check=True)\n        comparison=int(result.stdout.strip())\n        if not {'=':comparison==0,'>=':comparison>=0,'>':comparison>0,'<=':comparison<=0,'<':comparison<0}[op]:\n            raise ValueError('dependency_version_not_satisfied')\n\nclass SignatureVerificationError(ValueError):\n    def __init__(self,report):\n        super().__init__('package_signature_not_verified');self.report=report\n\ndef public_digest(path):\n    try:return hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()\n    except OSError:return None\n\ndef verify_signature(verifier,home,keyring,package):\n    from diagnostics import sanitize_text\n    from public_keyring import keyring_resource\n    verifier,home,keyring,package=map(pathlib.Path,(verifier,home,keyring,package))\n    name=package.name if re.fullmatch(r'[A-Za-z0-9+_.-]{1,180}',package.name) else '[invalid-package-name]'\n    report={'package':name,'archive_sha256':public_digest(package),'signature_sha256':public_digest(str(package)+'.sig'),\n      'verifier_sha256':public_digest(verifier),'keyring_sha256':public_digest(keyring),\n      'keyring_format':'unavailable','keyring_exists':keyring.is_file(),\n      'signature_exists':pathlib.Path(str(package)+'.sig').is_file(),'returncode':None,'exit_hex':None,\n      'status_codes':[],'fingerprints_or_keyids':[],'stderr_tail':[]}\n    try:\n        prefix=keyring.read_bytes()[:40]\n        report['keyring_format']='ascii_armor' if prefix.startswith(b'-----BEGIN PGP PUBLIC KEY BLOCK-----') else 'binary_or_unknown'\n    except OSError:pass\n    try:\n        result=subprocess.run([str(verifier),'--homedir',home.resolve().as_posix(),'--keyring',keyring_resource(keyring),\n          '--status-fd','1',pathlib.Path(str(package)+'.sig').resolve().as_posix(),package.resolve().as_posix()],capture_output=True,timeout=30)\n        report['returncode']=result.returncode;report['exit_hex']=f'0x{result.returncode&0xffffffff:08X}'\n        stdout=(result.stdout or b'').decode('utf-8',errors='replace')[-8192:]\n        stderr=(result.stderr or b'').decode('utf-8',errors='replace')[-8192:]\n        valid=[]\n        for line in stdout.splitlines():\n            m=re.fullmatch(r'\\[GNUPG:\\] ([A-Z_]+)(?: (.*))?',line)\n            if not m:continue\n            code,fields=m.groups();fields=(fields or '').split()\n            if code in {'VALIDSIG','GOODSIG','BADSIG','ERRSIG','NO_PUBKEY','EXPSIG','EXPKEYSIG','REVKEYSIG','FAILURE','NODATA','ERROR','KEY_CONSIDERED'}:\n                report['status_codes'].append(code)\n                if fields and re.fullmatch(r'[A-Fa-f0-9]{16,64}',fields[0]):\n                    value=fields[0].upper();report['fingerprints_or_keyids'].append(value)\n                    if code=='VALIDSIG' and len(value) in {40,64}:valid.append(value)\n        report['stderr_tail']=sanitize_text(stderr,home.parent)[-4:]\n        bad={'BADSIG','ERRSIG','NO_PUBKEY','EXPSIG','EXPKEYSIG','REVKEYSIG','FAILURE','NODATA','ERROR'}\n        if result.returncode or not valid or bad.intersection(report['status_codes']):raise SignatureVerificationError(report)\n        report['status']='PASS';report['stderr_tail']=[];return report\n    except subprocess.TimeoutExpired:\n        report['launch_failure']='timeout';raise SignatureVerificationError(report) from None\n    except OSError as e:\n        report['launch_failure']=type(e).__name__;report['winerror']=getattr(e,'winerror',None)\n        raise SignatureVerificationError(report) from None\n\ndef print_signature_failure(report):\n    # Print last, without traceback, so Run's bounded tail retains the useful facts.\n    for line in report['stderr_tail'][-3:]:print('PGP stderr: '+line[:200])\n    print('PGP verifier_sha256='+str(report['verifier_sha256']))\n    print('PGP keyring_sha256='+str(report['keyring_sha256'])+' format='+report['keyring_format'])\n    print('PGP archive_sha256='+str(report['archive_sha256']))\n    print('PGP signature_sha256='+str(report['signature_sha256']))\n    print('PGP fingerprints_or_keyids='+','.join(report['fingerprints_or_keyids'])[:160])\n    print('PGP status='+','.join(report['status_codes'])[:180])\n    print('PGP package='+report['package'])\n    print('PGP exit='+str(report['returncode'])+' hex='+str(report['exit_hex'])+' launch_failure='+str(report.get('launch_failure')))\n\ndef materialize(stage,zstd):\n    if os.environ.get('GITHUB_ACTIONS')!='true' or os.environ.get('GITHUB_EVENT_NAME')!='workflow_dispatch':raise RuntimeError('CI_only')\n    stage=pathlib.Path(stage);lock=json.loads(pathlib.Path(__file__).with_name('msys2-lock.json').read_text())\n    root=stage/'msys64'\n    if root.exists():raise ValueError('new_toolchain_root_required')\n    base=stage/'msys2-base.tar.xz';checked(base,lock['base']['sha256'])\n    import lzma\n    with lzma.open(base,'rb') as stream:unpack_stream(stream,root,'msys64/')\n    # gpgv uses only vendor's bundled public keyring; no key generation/import/download or private key reading.\n    verifier=root/'usr/bin/gpgv.exe';vendor_keyring=root/'usr/share/pacman/keyrings/msys2.gpg'\n    from public_keyring import prepare\n    keyring=stage/'vendor-public-binary-keyring.gpg'\n    keyring_conversion=prepare(vendor_keyring,keyring)\n    vercmp=root/'usr/bin/vercmp.exe'\n    verify_dependencies(lock['resolution_edges'],vercmp)\n    signature_reports=[]\n    for row in lock['packages']:\n        package=stage/'packages'/row['filename'];checked(package,row['sha256'])\n        home=stage/'verification-public-only';home.mkdir(exist_ok=True)\n        signature_reports.append(verify_signature(verifier,home,keyring,package))\n    # All signatures and hashes precede any overlay binary execution.\n    decoder_reports=[]\n    for row in lock['packages']:\n        package=stage/'packages'/row['filename']\n        decoder_reports.append(decode_unpack(zstd,package,root,stage))\n    report={'base_sha256':lock['base']['sha256'],'packages':[{'name':p['name'],'version':p['version'],'sha256':p['sha256']} for p in lock['packages']],\n            'all_signatures_verified':True,'keyring_conversion':keyring_conversion,'signature_verifications':signature_reports,\n            'decoder_completions':decoder_reports,'dependency_requirements_verified':True,\n            'package_install_hooks_executed':False,'keys_generated_or_imported':False,'archive_hardlinks_materialized_as_copies':True}\n    (stage/'toolchain-materialization.json').write_text(json.dumps(report,indent=2),encoding='utf-8')\nif __name__=='__main__':\n    try:materialize(*sys.argv[1:])\n    except SignatureVerificationError as e:\n        print_signature_failure(e.report);sys.exit('package_signature_not_verified')\n    except DecoderFailure as e:\n        print_decoder_failure(e.report);sys.exit('zstd_decode')\n\n'@\n$helper=$helper.Replace(\"`r`n\",\"`n\").Replace(\"`r\",\"`n\")\n[IO.File]::WriteAllText((Join-Path $env:TD_HELPERS 'materialize.py'),$helper,[Text.UTF8Encoding]::new($false))\n$helper=@'\n\"\"\"Offline host capability tests. No downloads, TDLib, client creation, or login.\"\"\"\nimport ctypes,hashlib,json,lzma,os,pathlib,platform,re,struct,subprocess,sys,zipfile\nfrom diagnostics import failure\n\nPAYLOAD=b'TDLIB_CAPABILITY_ZSTD_FIXTURE_V1\\n'\n# Zstandard RFC8878: single-segment frame, raw final block; no dictionary/checksum.\nZSTD_FIXTURE=bytes.fromhex('28b52ffd')+bytes([0x20,len(PAYLOAD)])+((len(PAYLOAD)<<3)|1).to_bytes(3,'little')+PAYLOAD\nPAYLOAD_SHA256=hashlib.sha256(PAYLOAD).hexdigest()\n\ndef sha(path):\n    h=hashlib.sha256()\n    with pathlib.Path(path).open('rb') as f:\n        for chunk in iter(lambda:f.read(1024*1024),b''):h.update(chunk)\n    return h.hexdigest()\n\ndef python_capabilities():\n    if sys.version_info<(3,12) or struct.calcsize('P')!=8 or sys.platform!='win32' or platform.machine().lower() not in {'amd64','x86_64'} or not hasattr(pathlib.Path,'is_junction'):\n        raise RuntimeError('Python_3_12_plus_Windows_x64_required')\n    marker=b'TDLIB_PYTHON_CAPABILITY_V1'\n    if lzma.decompress(lzma.compress(marker))!=marker or hashlib.sha256(marker).digest()==b'':raise RuntimeError('Python_capability_failure')\n    import io\n    stream=io.BytesIO()\n    with zipfile.ZipFile(stream,'w') as z:z.writestr('marker',marker)\n    with zipfile.ZipFile(stream) as z:\n        if z.read('marker')!=marker:raise RuntimeError('Python_zip_failure')\n    return {'version':platform.python_version(),'bits':64,'is_junction':True,'modules':['lzma','zipfile','ctypes','hashlib']}\n\ndef run_checked(args,stage,name,executor=subprocess.run,timeout=30):\n    stage=pathlib.Path(stage);log=stage/'preflight-public.log'\n    try:\n        with log.open('wb') as f:r=executor(list(map(str,args)),stdout=f,stderr=subprocess.STDOUT,timeout=timeout,check=False)\n        code=r.returncode\n    except subprocess.TimeoutExpired:\n        code=124\n    if code:\n        raise RuntimeError(json.dumps(failure(name,code,log,stage)))\n    if log.stat().st_size>65536:raise RuntimeError('preflight_output_cap')\n    return log.read_bytes()\n\ndef tool(path,version):\n    p=pathlib.Path(path).resolve()\n    if not p.is_file():raise RuntimeError('host_tool_missing')\n    # Hosted executable metadata only, never command lines or user configuration.\n    return {'path':str(p),'version':version[:160],'sha256':sha(p)}\n\ndef preflight(stage,ninja,zstd,executor=subprocess.run,capability=python_capabilities):\n    stage=pathlib.Path(stage);py=capability()\n    nv=run_checked([ninja,'--version'],stage,'ninja-version',executor).decode('ascii',errors='replace').strip()\n    if not re.fullmatch(r'\\d+\\.\\d+(?:\\.\\d+)?(?:[._+-][A-Za-z0-9.-]+)?',nv):raise RuntimeError('ninja_version_unrecognized')\n    work=stage/'ninja-fixture';work.mkdir()\n    (work/'emit.py').write_text(\"from pathlib import Path\\nPath('marker.txt').write_bytes(b'TDLIB_NINJA_CAPABILITY_V1')\\n\",encoding='ascii')\n    pycmd=str(pathlib.Path(sys.executable)).replace('$','$$')\n    (work/'build.ninja').write_text('rule emit\\n  command = \"'+pycmd+'\" emit.py\\nbuild marker.txt: emit\\ndefault marker.txt\\n',encoding='utf-8')\n    run_checked([ninja,'-C',work,'-f','build.ninja','-j','1'],stage,'ninja-fixture',executor)\n    if (work/'marker.txt').read_bytes()!=b'TDLIB_NINJA_CAPABILITY_V1':raise RuntimeError('ninja_fixture_failure')\n    zv=run_checked([zstd,'--version'],stage,'zstd-version',executor).decode('ascii',errors='replace').strip()\n    fixture=stage/'known-fixture.zst';fixture.write_bytes(ZSTD_FIXTURE)\n    decoded=run_checked([zstd,'-dc',fixture],stage,'zstd-fixture',executor)\n    if hashlib.sha256(decoded).hexdigest()!=PAYLOAD_SHA256:raise RuntimeError('zstd_fixture_hash')\n    return {'status':'PASS','python':{**tool(sys.executable,py['version']),**py},'ninja':tool(ninja,nv),'zstd':tool(zstd,zv),\n            'ninja_fixture':'PASS','zstd_fixture_sha256':PAYLOAD_SHA256,'network_requested':False,'tdlib_loaded':False}\n\nif __name__=='__main__':\n    try:\n        report=preflight(*sys.argv[1:]);pathlib.Path(sys.argv[1],'capability-preflight.json').write_text(json.dumps(report,indent=2),encoding='utf-8')\n        print('Host capability preflight PASS; no downloads or TDLib invocation.')\n    except Exception as e:\n        # Only our sanitized Run failure JSON or a fixed code crosses to the public log.\n        msg=str(e)\n        if msg.startswith('{'):\n            try:\n                d=json.loads(msg)\n                if set(d)=={'stage','exit_code','tail'}:print(json.dumps(d))\n            except Exception:pass\n        sys.exit('host_capability_preflight_failed')\n\n'@\n$helper=$helper.Replace(\"`r`n\",\"`n\").Replace(\"`r\",\"`n\")\n[IO.File]::WriteAllText((Join-Path $env:TD_HELPERS 'preflight.py'),$helper,[Text.UTF8Encoding]::new($false))\n$helper=@'\n\"\"\"Bounded diagnostics from one explicitly selected public build-stage log only.\"\"\"\nimport hashlib,json,pathlib,re,sys\n\ndef sanitized_tail(log,stage):\n    log,stage=pathlib.Path(log),pathlib.Path(stage)\n    if log.is_symlink() or log.is_junction() or log.resolve().parent!=stage.resolve():\n        raise ValueError('diagnostic_log_outside_stage')\n    with log.open('rb') as f:\n        f.seek(0,2);length=f.tell();f.seek(max(0,length-8192));text=f.read(8192).decode('utf-8',errors='replace')\n    return sanitize_text(text,stage)\n\ndef sanitize_text(text,stage):\n    stage=pathlib.Path