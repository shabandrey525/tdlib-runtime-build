('\\')+'\\'\nif(-not $Stage.StartsWith($base,[StringComparison]::OrdinalIgnoreCase) -or (Test-Path -LiteralPath $Stage)){throw 'new_runner_temp_stage_required'}\nNew-Item -ItemType Directory -Path (Join-Path $Stage 'packages') -Force|Out-Null\nfunction Run([string]$StageName,[string]$Exe,[string[]]$Arguments){\n if($StageName -notmatch '^[a-z][a-z0-9_-]{0,47}$'){throw 'invalid_stage_name'}\n $script:lastLog=Join-Path $Stage ($StageName+'.log')\n [IO.File]::WriteAllText($script:lastLog,'',[Text.UTF8Encoding]::new($false))\n $code=126\n try { & $Exe @Arguments >> $script:lastLog 2>&1;$code=$LASTEXITCODE } catch { [IO.File]::AppendAllText($script:lastLog,\"native_command_launch_failed`n\") }\n if($code -ne 0){\n   try { & $python (Join-Path $PSScriptRoot 'diagnostics.py') $StageName $code $script:lastLog $Stage } catch { Write-Output 'diagnostic_helper_unavailable' }\n   throw (\"public_stage_failed:\"+$StageName+\":exit=\"+$code)\n }\n}\nfunction Download([string]$Url,[string]$Hash,[string]$Path){\n try { Invoke-WebRequest -Uri $Url -OutFile $Path } catch { throw 'public_vendor_download_failed' }\n if((Get-FileHash $Path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $Hash){throw 'vendor_hash_mismatch'}\n}\n$python=(Get-Command python -CommandType Application).Source\n$ninja=(Get-Command ninja -CommandType Application).Source\n$zstd=(Get-Command zstd -CommandType Application).Source\nRun 'host-capability-preflight' $python @((Join-Path $PSScriptRoot 'preflight.py'),$Stage,$ninja,$zstd)\n$capabilities=Get-Content (Join-Path $Stage 'capability-preflight.json') -Raw|ConvertFrom-Json\nif($capabilities.status -ne 'PASS'){throw 'capability_preflight_not_verified'}\n$runnerMetadata=@{observed_image=$env:ImageVersion;reviewed_image=$pins.runner.reviewed_image;image_drift_warning=$imageWarning;\n os=$env:RUNNER_OS;image_os=$env:ImageOS;architecture=$env:RUNNER_ARCH;capabilities=$capabilities}\n$runnerMetadata|ConvertTo-Json -Depth 10|Set-Content -LiteralPath (Join-Path $Stage 