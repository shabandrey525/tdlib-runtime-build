archive_outside_verified_roots')\n        try:inside=ntpath.commonpath([target,root]).casefold()==root.casefold()\n        except ValueError:inside=False\n        if not inside:raise ValueError('archive_outside_verified_roots')\n        if os.name=='nt' and not pathlib.Path(target).resolve().is_relative_to(pathlib.Path(root).resolve()):raise ValueError('archive_outside_verified_roots')\n    else:\n        if re.match(r'^[A-Za-z]:',value):raise ValueError('archive_outside_verified_roots')\n        path=pathlib.Path(value)\n        if not path.is_absolute():path=pathlib.Path(build)/path\n        if not path.resolve().is_relative_to(pathlib.Path(expected_root).resolve()):raise ValueError('archive_outside_verified_roots')\n    return True\n\ndef gate(stage,dll):\n    stage,dll=map(pathlib.Path,(stage,dll));pins=json.loads((ROOT/'pins.json').read_text());lock=json.loads((ROOT/'msys2-lock.json').read_text())\n    material=json.loads((stage/'toolchain-materialization.json').read_text())\n    if material['base_sha256']!=lock['base']['sha256'] or not material['all_signatures_verified'] or not material.get('dependency_requirements_verified') or material['keys_generated_or_imported']:\n        raise ValueError('unverified_toolchain')\n    expected=[{'name':p['name'],'version':p['version'],'sha256':p['sha256']} for p in lock['packages']]\n    if material['packages']!=expected:raise ValueError('toolchain_lock_drift')\n    cache=(stage/'build/CMakeCache.txt').read_text(encoding='utf-8-sig')\n    compiler_files=list((stage/'build/CMakeFiles').glob('*/CMakeCXXCompiler.cmake'))\n    if len(compiler_files)!=1:raise ValueError('compiler_metadata')\n    compiler=compiler_files[0].read_text()\n    if 'set(CMAKE_CXX_COMPILER_ID \"GNU\")' not in compiler or f'set(CMAKE_CXX_COMPILER_VERSION \"{pins[\"gcc\"]}\")' not in compiler:\n        raise ValueError('not_pinned_GCC')\n    for key,value in {'CMAKE_BUILD_TYPE':'Release','TD_ENABLE_LTO':'OFF','TD_ENABLE_PCH':'OFF','TD_WITH_ABSEIL':'OFF',\n                      'CMAKE_DISABLE_FIND_PACKAGE_Crc32c':'TRUE','CMAKE_DISABLE_FIND_PACKAGE_ABSL':'TRUE',\n                      'CRC32C_FOUND':'FALSE','ABSL_FOUND':'FALSE','CMAKE_C_FLAGS':'-pthread','CMAKE_CXX_FLAGS':'-pthread'}.items():\n        if not re.search(r'^'+re.escape(key)+r':[^=]+='+re.escape(value)+r'$',cache,re.M):raise ValueError('configuration_drift')\n    linkmap=(stage/'build/tdjson-release.map').read_text(encoding='utf-8',errors='replace')\n    if re.search(r'(?i)\\.lib(?:[\\s()]|$)|Visual.Studio|libcmt|vcruntime|msvcp140',linkmap):raise ValueError('MSVC_code_forbidden')\n    archives=set(re.findall(r'(?im)^LOAD\\s+(.+?\\.a)\\s*$',linkmap))\n    allowed={'libcrypto.a','libssl.a','libz.a','libgcc.a','libgcc_eh.a','libstdc++.a','libsupc++.a',\n             'libmingw32.a','libmingwex.a','libmingwthrd.a','libmoldname.a','libucrt.a','libucrtbase.a','libmsvcrt.a','libwinpthread.a','libpthread.a',\n             'libkernel32.a','libuser32.a','libadvapi32.a','libshell32.a','libole32.a','liboleaut32.a','libuuid.a',\n             'libws2_32.a','libmswsock.a','libcrypt32.a','libbcrypt.a','libnormaliz.a','libpsapi.a',\n             'libntdll.a','libuserenv.a','librpcrt4.a','libversion.a','libm.a','libgdi32.a','libwinspool.a','libcomdlg32.a'}\n    names={p.replace('\\\\','/').rsplit('/',1)[-1].lower() for p in archives}\n    for raw in archives:\n        name=raw.replace('\\\\','/').rsplit('/',1)[-1].lower()\n        expected_root=stage/'build' if re.fullmatch(r'libtd[a-z0-9_]+\\.a',name) else stage/'msys64/ucrt64'\n        archive_in_root(raw,stage/'build',expected_root)\n    if not {'libcrypto.a','libz.a','libstdc++.a','libgcc.a'}.issubset(names):raise ValueError('incomplete_GNU_link_map')\n    if any(n not in allowed and not re.fullmatch(r'libtd[a-z0-9_]+\\.a',n) for n in names):raise ValueError('unreviewed_static_archive')\n    pe=inspect(dll.read_bytes())\n    return {'status':'PASS','dll_sha256':sha(dll),'compiler':'GNU '+pins['gcc'],'archives':sorted(names),'map_sha256':sha(stage/'build/tdjson-release.map'),\n            'all_packages_signature_verified':True,'msvc_code_allowed':False,'pe':pe,\n            'license_basis':'GCC Runtime Exception 3.1 eligible compilation; MinGW ZPL/BSD; winpthreads MIT/BSD; independent TDLib/OpenSSL/zlib notices'}\n\ndef verify(root,require_probe=False):\n    root=pathlib.Path(root);entries=files(root)\n    for p in entries:\n        n=p.relative_to(root).as_posix()\n        if n not in {'tdjson.dll','provenance.json','manifest.json','CHECKSUMS.sha256'} and not re.fullmatch(r'licenses/[A-Za-z0-9_.-]+\\.txt',n):raise ValueError('unexpected_artifact')\n    prov=json.loads((root/'provenance.json').read_text());pins=json.loads((ROOT/'pins.json').read_text())\n    if prov['tdlib_commit']!=pins['tdlib']['commit'] or prov['toolchain_lock_sha256']!=sha(ROOT/'msys2-lock.json'):raise ValueError('provenance_pin')\n    if prov['release_gate']['status']!='PASS' or prov['release_gate']['dll_sha256']!=sha(root/'tdjson.dll') or prov['release_gate']['msvc_code_allowed'] is not False:raise ValueError('release_gate')\n    if require_probe and (prov.get('offline_probe',{}).get('offline_sync_getJsonValue')!='PASS' or prov['offline_probe'].get('dll_sha256')!=sha(root/'tdjson.dll')):raise ValueError('offline_proof')\n    manifest=json.loads((root/'manifest.json').read_text());actual={p.relative_to(root).as_posix():p for p in entries if p.name not in {'manifest.json','CHECKSUMS.sha256'}}\n    expected={e['path']:e for e in manifest['files']}\n    if set(expected)!=set(actual) or any(sha(p)!=expected[n]['sha256'] or p.stat().st_size!=expected[n]['bytes'] for n,p in actual.items()):raise ValueError('manifest_hash')\n    checks={line.split('  ',1)[1]:line.split('  ',1)[0] for line in (root/'CHECKSUMS.sha256').read_text().splitlines()}\n    target={p.relative_to(root).as_posix():p for p in entries if p.name!='CHECKSUMS.sha256'}\n    if set(checks)!=set(target) or any(checks[n]!=sha(p) for n,p in target.items()):raise ValueError('checksum')\n    notices='\\n'.join(p.read_text(encoding='utf-8',errors='replace') for p in entries if p.parent.name=='licenses')\n    for marker in ['GCC RUNTIME LIBRARY EXCEPTION','Version 3.1','Boost Software License','ZETETIC','Apache License','Zope Public License']:\n        if marker not in notices:raise ValueError('license_closure_missing')\n    return inspect((root/'tdjson.dll').read_bytes())\n\ndef package(stage,dll,out):\n    stage,dll,out=map(pathlib.Path,(stage,dll,out));release=gate(stage,dll)\n    if out.exists():raise ValueError('new_output_required')\n    out.mkdir();(out/'licenses').mkdir();shutil.copyfile(dll,out/'tdjson.dll')\n    notices=list((stage/'msys64/ucrt64/share/licenses').rglob('*'))\n    notice_names=set()\n    for p in notices:\n        if p.is_file() and not(p.is_symlink() or p.is_junction()):\n            n=re.sub('[^A-Za-z0-9_.-]','_',p.relative_to(stage/'msys64/ucrt64/share/licenses').as_posix())+'.txt'\n            if n.lower() in notice_names:raise ValueError('notice_name_collision')\n            notice_names.add(n.lower())\n            shutil.copyfile(p,out/'licenses'/n)\n    td=stage/'td'\n    for source,name in [('LICENSE_1_0.txt','TDLib.txt'),('sqlite/sqlite/LICENSE','SQLite.txt'),('td/generate/tl-parser/LICENSE','TL-parser-build-only.txt')]:shutil.copyfile(td/source,out/'licenses'/name)\n    prov={'schema':1,'tdlib_commit':json.loads((ROOT/'pins.json').read_text())['tdlib']['commit'],\n          'toolchain_lock_sha256':sha(ROOT/'msys2-lock.json'),'release_gate':release,\n          'toolchain':json.loads((stage/'toolchain-materialization.json').read_text()),\n          'runtime_component_versions':{k:json.loads((ROOT/'pins.json').read_text())[k] for k in ['gcc','openssl','zlib']},\n          'run':json.loads((stage/'run-provenance.json').read_text()),'offline_probe':{'status':'pending'}}\n    if (stage/'offline-result.json').exists():prov['offline_probe']=json.loads((stage/'offline-result.json').read_text