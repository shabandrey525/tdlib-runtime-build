s(3,'big')\n\ndef length(data,i):\n    x=data[i];i+=1\n    if x<192:return x,i\n    if x<224:return ((x-192)<<8)+data[i],i+1\n    if x==255:return int.from_bytes(data[i:i+4],'big'),i+4\n    raise ValueError('public_keyring_partial_length')\n\ndef fingerprints(data):\n    i=0;keys=[];primary=0\n    while i<len(data):\n        h=data[i];i+=1\n        if not h&128:raise ValueError('public_keyring_packet_header')\n        if h&64:tag=h&63;n,i=length(data,i)\n        else:\n            tag=(h>>2)&15;kind=h&3\n            if kind==3:raise ValueError('public_keyring_indeterminate_length')\n            width=[1,2,4][kind];n=int.from_bytes(data[i:i+width],'big');i+=width\n        if n<1 or n>len(data)-i:raise ValueError('public_keyring_packet_size')\n        body=data[i:i+n];i+=n\n        if tag not in {2,6,13,14,17}:raise ValueError('public_keyring_nonpublic_packet')\n        if tag in {6,14}:\n            if body[0]!=4:raise ValueError('public_keyring_unreviewed_version')\n            if tag==6:primary+=1\n            keys.append(hashlib.sha1(b'\\x99'+len(body).to_bytes(2,'big')+body).hexdigest().upper())\n    if not primary:raise ValueError('public_keyring_empty')\n    return sorted(keys),primary\n\ndef dearmor(data):\n    if len(data)>1_000_000:raise ValueError('public_keyring_cap')\n    text=data.decode('ascii').replace('\\r\\n','\\n')\n    pattern=r'-----BEGIN PGP PUBLIC KEY BLOCK-----\\n(.*?)-----END PGP PUBLIC KEY BLOCK-----'\n    matches=list(re.finditer(pattern,text,re.S));remaining=re.sub(pattern,'',text,flags=re.S)\n    if not matches or remaining.strip():raise ValueError('public_keyring_armor_structure')\n    raw=b''\n    for match in matches:\n        lines=match.group(1).splitlines();body=[];checksum=[];headers=True\n        for line in lines:\n            line=line.strip()\n            if not line:headers=False;continue\n            if headers and re.fullmatch(r'(?:Version|Comment):[ -~]*',line):continue\n            headers=False\n            if line.startsw