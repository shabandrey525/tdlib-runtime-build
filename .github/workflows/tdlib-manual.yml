20)\n        self.is_dll = bool(self.u16(pe + 22) & 0x2000)\n        opt = pe + 24\n        if self.u16(opt) != 0x20b or size < 240 or not 1 <= count <= 96:\n            raise ValueError('not_PE32_plus')\n        self.imagebase = self.u64(opt + 24)\n        self.headers = self.u32(opt + 60)\n        self.sections = []\n        for i in range(count):\n            p = opt + size + i * 40\n            self.sections.append((self.u32(p+12), self.u32(p+16), self.u32(p+20)))\n        dirs = self.u32(opt + 108)\n        self.directories = [tuple(struct.unpack('<II', self.read(opt+112+i*8, 8)))\n                            for i in range(min(dirs, 16))]\n    def read(self, offset, size):\n        if offset < 0 or size < 0 or offset + size > len(self.data): raise ValueError('PE_bounds')\n        return self.data[offset:offset+size]\n    def u16(self,p): return struct.unpack('<H',self.read(p,2))[0]\n    def u32(self,p): return struct.unpack('<I',self.read(p,4))[0]\n    def u64(self,p): return struct.unpack('<Q',self.read(p,8))[0]\n    def offset(self,rva,size=1):\n        if rva < self.headers:\n            self.read(rva,size); return rva\n        for va,rawsize,raw in self.sections:\n            if va <= rva and rva+size <= va+rawsize:\n                p=raw+rva-va; self.read(p,size); return p\n        raise ValueError('PE_RVA_bounds')\n    def string(self,rva):\n        out=bytearray()\n        for i in range(4096):\n            b=self.data[self.offset(rva+i)]\n            if b == 0: return out.decode('ascii')\n            out.append(b)\n        raise ValueError('PE_string_too_long')\n    def directory(self,index):\n        return self.directories[index] if index < len(self.directories) else (0,0)\n    def exports(self):\n        rva,size=self.directory(0)\n        if not rva: return {}\n        p=self.offset(rva,40); functions=self.u32(p+20); count=self.u32(p+24)\n        if count>100000 or functions>100000: raise ValueError('PE_export_count')\n        names=self.u32(p+32); ordinals=self.u32(p+36); addresses=self.u32(p+28)\n        result={}\n        for i in range(count):\n            name=self.string(self.u32(self.offset(names+i*4,4)))\n            ordinal=self.u16(self.offset(ordinals+i*2,2))\n            if ordinal>=functions: raise ValueError('PE_ordinal_bounds')\n            address=self.u32(self.offset(addresses+ordinal*4,4))\n            result[name]={'forwarded': rva<=address<rva+size}\n        return result\n    def imports(self):\n        names=[]\n        for index,stride,name_offset in [(1,20,12),(13,32,4)]:\n            rva,size=self.directory(index)\n            if not rva: continue\n            if size<stride or size//stride>4096: raise ValueError('PE_import_size')\n            for i in range(size//stride):\n                p=self.offset(rva+i*stride,stride)\n                if not any(self.read(p,stride)): break\n                name=self.u32(p+name_offset)\n                if index==13 and not self.u32(p)&1: name-=self.imagebase\n                names.append(self.string(name).lower())\n            else: raise ValueError('PE_import_terminator_missing')\n        return sorted(set(names))\n\nREQUIRED = {'td_create_client_id','td_send','td_receive','td_execute'}\nSYSTEM_DLLS = {'kernel32.dll','kernelbase.dll','advapi32.dll','bcrypt.dll','crypt32.dll',\n 'ws2_32.dll','iphlpapi.dll','dnsapi.dll','user32.dll','userenv.dll','shell32.dll',\n 'ole32.dll','oleaut32.dll','secur32.dll','ncrypt.dll','normaliz.dll','ntdll.dll',\n 'rpcrt4.dll','shlwapi.dll','version.dll','winmm.dll','ucrtbase.dll','psapi.dll'}\ndef inspect(data):\n    p=PE(data)\n    if p.machine!=0x8664 or not p.is_dll: raise ValueError('x64_DLL_required')\n    exports=p.exports()\n    if not REQUIRED.issubset(exports): raise ValueError('required_exports_missing')\n    if any(exports[x]['forwarded'] for x in REQUIRED): raise ValueError('forwarded_required_export')\n    imports=p.imports()\n    unsupported=[x for x in imports if not re.fullmatch(r'[a-z0-9_.-]+\\.dll